seed: 42

paths:
  raw: data/raw
  interim: data/interim        # gitignored (under data/)
  results: results
  app_data: app_data           # committed only after sign-off

# Time split by submission_time. A = history, B = validation, C = test (touch once).
periods:
  b_start: "2022-07-01"
  c_start: "2022-12-01"
  c_end:   "2023-03-22"        # exclusive; data ends 2023-03-21

positive_min_rating: 4
min_group_size: 20             # hide any aggregate or slice with fewer reviews/users

# tertiary_category -> routine step
routine_steps:
  "Face Wash & Cleansers": cleanser
  "Face Serums": treatment
  "Blemish & Acne Treatments": treatment
  "Moisturizers": moisturiser
  "Night Creams": moisturiser
  "Face Oils": moisturiser

eval:
  k: 10
  bootstrap_samples: 1000
  candidates_per_model: 100

popularity:
  window_days: 365   # maximin over 4 backtests (see docs/decisions.md)

hand_score:
  # v1 (brief): grid kept so the failed attempt is reproducible
  m_grid: [5, 20, 50]
  lambda_grid: [0.0, 0.05, 0.1, 0.2]
  # v2 (shipped): tuned on B, see results/val_baselines.json
  m: 20
  guard_gap: 0.10
  guard_min_n: 20

itemknn:
  shrink: 10

ranker:
  candidates_per_model: 100
  # Cross-period validation (a within-period user hold-out leaked period-specific item popularity):
  # train labels in T1, early stopping on T2, select and compare on B. Final model: B labels -> test C.
  t1: ["2022-01-01", "2022-05-01"]
  t2: ["2022-05-01", "2022-07-01"]
  grid:
    num_leaves: [15, 63]
    min_child_samples: [50, 200]

llm:
  model: gpt-4.1-mini        # default when LLM_MODEL is not set; supports temperature 0.2
  session_cap: 5
  daily_cap: 100

# Extended model study: rolling validation folds, all before the test period C.
# Each fold: ranker trained on [train_start, eval_start), evaluated on [eval_start, eval_end).
study:
  folds:
    - [F1, "2021-07-01", "2021-12-01", "2021-02-01"]
    - [F2, "2022-02-01", "2022-07-01", "2021-09-01"]
    - [F3_B, "2022-07-01", "2022-12-01", "2022-02-01"]
  candidates_per_model: 100
  grids:
    itemknn: {shrink: [0, 10, 50, 200]}
    rp3beta: {alpha: [0.25, 0.5, 1.0], beta: [0.0, 0.15, 0.3, 0.5]}
    ease: {lam: [300, 1000, 3000, 10000, 30000]}
    ials: {factors: [64, 128], reg: [0.1, 1.0, 10.0], alpha: [5, 20]}
    bpr: {factors: [64], lr: [0.001, 0.003, 0.01], weight_decay: [0.0001, 0.001]}
  ranker:
    num_leaves: 31
    min_child_samples: 100
    rounds: [100, 300]
    variants: [original, client_centric, client_centric_binary]
  # Written before the second test run. A model replaces popularity only if its
  # catalogue NDCG@10 beats popularity with a 95% CI above zero in EVERY fold;
  # among those, the highest mean wins. Launch slot: same rule against random.
  selection_rule: "beats baseline (CI > 0) in every fold, then highest mean"
